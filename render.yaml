# Render Blueprint (optional): New → Blueprint → pick this repo.
# Secret values are NOT stored here – `sync: false` makes Render ask for
# them in the dashboard when the blueprint is created.
services:
  - type: web
    name: campuseats-api
    runtime: docker
    plan: free
    rootDir: campuseats-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: CampusEats
      - key: Jwt__Audience
        value: CampusEatsUsers
      - key: Cors__AllowedOrigins
        sync: false
